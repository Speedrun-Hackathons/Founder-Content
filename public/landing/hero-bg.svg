<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06" />
      </feComponentTransfer>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="gridMask">
      <rect width="1600" height="1000" fill="url(#fade)" />
    </mask>
  </defs>
  <rect width="1600" height="1000" fill="#0c0a1d" />
  <g filter="url(#blur)">
    <circle cx="380" cy="260" r="300" fill="#6236e8" fill-opacity="0.75" />
    <circle cx="1240" cy="220" r="260" fill="#ff6b45" fill-opacity="0.45" />
    <circle cx="980" cy="760" r="320" fill="#7352f4" fill-opacity="0.55" />
    <circle cx="180" cy="860" r="220" fill="#1baf7a" fill-opacity="0.25" />
  </g>
  <rect width="1600" height="1000" fill="url(#grid)" mask="url(#gridMask)" />
  <g fill="none" stroke="#ffffff" stroke-opacity="0.08">
    <circle cx="1240" cy="220" r="180" />
    <circle cx="1240" cy="220" r="300" />
    <circle cx="1240" cy="220" r="430" />
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" />
</svg>
